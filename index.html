<title>Penampil Dokumen</title>
<style>
:root{--bg:#e5e7eb;--fg:#111827;--card:#fff;--mut:#6b7280;--bar:#1f2937;--acc:#2563eb;--bd:#cbd5e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e5e7eb;--card:#1e293b;--mut:#94a3b8;--bar:#020617;--acc:#60a5fa;--bd:#334155;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e5e7eb;--card:#1e293b;--mut:#94a3b8;--bar:#020617;--acc:#60a5fa;--bd:#334155;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bar);color:#fff}
.logo{width:36px;height:36px;flex:none}
header h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header label{position:relative;overflow:hidden;background:var(--acc);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;flex:none}
header input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#msg{margin:16px;padding:32px 18px;text-align:center;background:var(--card);border:2px dashed var(--bd);border-radius:12px;white-space:pre-line;color:var(--mut)}
#msg input,#msg button{font-size:16px;padding:8px 12px;margin:6px 0}
.pg{margin:6px auto;background:#fff;overflow:hidden;max-width:900px}
.pg canvas{display:block}
pre.txt{margin:0;padding:14px;background:var(--card);white-space:pre-wrap;word-break:break-word;font-size:14px;min-height:60vh}
img.full{display:block;max-width:100%;margin:8px auto;border-radius:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--bar)}
.tabs button{flex:none;padding:6px 12px;border:0;border-radius:6px;background:#374151;color:#fff;font-size:14px}
.tabs button.on{background:var(--acc)}
.tw{overflow:auto;background:var(--card)}
.tw table{border-collapse:collapse;font-size:13px}
.tw td,.tw th{border:1px solid var(--bd);padding:3px 8px;white-space:pre;vertical-align:top}
.note{padding:8px 14px;background:#fef3c7;color:#78350f;font-size:13px}
.slide{background:var(--card);margin:8px;padding:12px;border-radius:8px}
.slide h4{margin:0 0 6px;color:var(--acc);font-size:13px}
.slide p{margin:4px 0}
iframe.h{width:100%;border:0;background:#fff;height:85vh}
.docx-wrapper{background:var(--bg)!important;padding:8px!important}
</style></head>

async function viewPdf(buf){
  await load('pdf');
  pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
  const task=pdfjsLib.getDocument({data:new Uint8Array(buf)});
  task.onPassword=(up,why)=>{
    const d=msg(why===2?'Kata sandi salah, coba lagi.':'PDF ini dilindungi kata sandi.');
    d.insertAdjacentHTML('beforeend','<br><input type="password" placeholder="Kata sandi"> <button>Buka</button>');
    d.querySelector('button').onclick=()=>up(d.querySelector('input').value);
  };
  const pdf=await task.promise;out.innerHTML='';
  const v1=(await pdf.getPage(1)).getViewport({scale:1}),ratio=v1.height/v1.width,W=()=>Math.min(out.clientWidth,900);
  async function draw(d){
    if(d.dataset.done)return;d.dataset.done=1;
    const pg=await pdf.getPage(+d.dataset.n),vp=pg.getViewport({scale:1}),v=pg.getViewport({scale:W()/vp.width*Math.min(devicePixelRatio||1,2)});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width='100%';c.style.height='auto';
    d.style.height='auto';d.appendChild(c);
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
  }
  const obs=new IntersectionObserver(es=>es.forEach(e=>{
    const d=e.target;
    if(e.isIntersecting)draw(d).catch(()=>{});
    else if(d.dataset.done){d.style.height=d.clientHeight+'px';d.innerHTML='';delete d.dataset.done}
  }),{rootMargin:'700px 0px'});
  for(let i=1;i<=pdf.numPages;i++){const d=document.createElement('div');d.className='pg';d.dataset.n=i;d.style.height=W()*ratio+'px';out.appendChild(d);obs.observe(d)}
}

  paras(await z.file(f).async('string'),['p']).filter(t=>t.trim()).forEach(t=>{const p=document.createElement('p');p.textContent=t;card.appendChild(p)});
  const rel=z.file(f.replace('slides/','slides/_rels/')+'.rels');
  if(rel){for(const m of (await rel.async('string')).matchAll(/Target="([^"]+)"/g)){if(/media\//.test(m[1])){const u=await zipImg(z,'ppt/media/'+m[1].split('/').pop());if(u)addImg(card,u)}}}
  return card;

async function renderSlide(z,f,cx,cy,W,sc){
  const xml=new DOMParser().parseFromString(await z.file(f).async('string'),'application/xml');
  const rels={},rf=z.file(f.replace('slides/','slides/_rels/')+'.rels');
  if(rf){const rx=new DOMParser().parseFromString(await rf.async('string'),'application/xml');for(const r of rx.getElementsByTagName('Relationship'))rels[r.getAttribute('Id')]=r.getAttribute('Target')}
  const d=document.createElement('div');
  d.style.cssText='position:relative;overflow:hidden;width:'+W+'px;height:'+(W*cy/cx)+'px;margin:0 auto;background:#fff';
  let dark=false;
  const bg=xml.getElementsByTagNameNS('*','bg')[0];
  if(bg){const c=bg.getElementsByTagNameNS('*','srgbClr')[0];if(c){const h=c.getAttribute('val');d.style.background='#'+h;const n=parseInt(h,16);dark=(((n>>16)&255)*.3+((n>>8)&255)*.59+(n&255)*.11)<110}}
  const tree=xml.getElementsByTagNameNS('*','spTree')[0];
  if(!tree)throw new Error('slide kosong');
  let fy=cy*.05;
  for(const el of tree.getElementsByTagNameNS('*','*')){
    if(el.localName!=='sp'&&el.localName!=='pic')continue;
    const xf=el.getElementsByTagNameNS('*','xfrm')[0];
    let x,y,w,h;
    const off=xf&&xf.getElementsByTagNameNS('*','off')[0],ext=xf&&xf.getElementsByTagNameNS('*','ext')[0];
    if(off&&ext){x=+off.getAttribute('x');y=+off.getAttribute('y');w=+ext.getAttribute('cx');h=+ext.getAttribute('cy')}
    else{x=cx*.05;y=fy;w=cx*.9;h=cy*.15;fy+=cy*.17}
    const b=document.createElement('div');
    b.style.cssText='position:absolute;left:'+x/cx*100+'%;top:'+y/cy*100+'%;width:'+w/cx*100+'%;height:'+h/cy*100+'%;box-sizing:border-box';
    if(el.localName==='pic'){
      const bl=el.getElementsByTagNameNS('*','blip')[0],rid=bl&&(bl.getAttribute('r:embed')||bl.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed'));
      const u=rid&&rels[rid]?await zipImg(z,'ppt/media/'+rels[rid].split('/').pop()):null;
      if(!u)continue;
      const im=document.createElement('img');im.src=u;im.style.cssText='width:100%;height:100%;object-fit:fill';b.appendChild(im);d.appendChild(b);continue;
    }
    const sp=el.getElementsByTagNameNS('*','spPr')[0];
    if(sp)for(const c of sp.children){if(c.localName==='solidFill'){const k=c.getElementsByTagNameNS('*','srgbClr')[0];if(k)b.style.background='#'+k.getAttribute('val')}}
    for(const pe of el.getElementsByTagNameNS('*','p')){
      const pd=document.createElement('div'),pp=pe.getElementsByTagNameNS('*','pPr')[0];
      const al=pp&&pp.getAttribute('algn');
      pd.style.textAlign=al==='ctr'?'center':al==='r'?'right':al==='just'?'justify':'left';
      let any=false,last=18;
      for(const n of pe.children){
        if(n.localName==='br'){pd.appendChild(document.createElement('br'));continue}
        if(n.localName!=='r'&&n.localName!=='fld')continue;
        const t=n.getElementsByTagNameNS('*','t')[0];if(!t)continue;
        const rp=n.getElementsByTagNameNS('*','rPr')[0],sp2=document.createElement('span');
        sp2.textContent=t.textContent;any=true;
        let sz=rp&&rp.getAttribute('sz');sz=sz?+sz/100:18;last=sz;
        sp2.style.fontSize=Math.max(6,sz*sc)+'px';
        if(rp&&rp.getAttribute('b')==='1')sp2.style.fontWeight='bold';
        if(rp&&rp.getAttribute('i')==='1')sp2.style.fontStyle='italic';
        const k=rp&&rp.getElementsByTagNameNS('*','srgbClr')[0];
        sp2.style.color=k?'#'+k.getAttribute('val'):(dark?'#fff':'#111');
        pd.appendChild(sp2);
      }
      if(!any){pd.style.height=Math.max(6,last*sc)+'px'}
      pd.style.lineHeight='1.2';b.appendChild(pd);
    }
    d.appendChild(b);
  }
  return d;
}
async function viewPptx(buf){
  await load('zip');
  const z=await JSZip.loadAsync(buf),fs=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>numOf(a)-numOf(b));
  if(!fs.length)throw new Error('Tidak ada slide di file ini (mungkin bukan file .pptx yang asli)');
  let cx=9144000,cy=5143500;
  try{const m=(await z.file('ppt/presentation.xml').async('string')).match(/<p:sldSz[^>]*?cx="(\d+)"[^>]*?cy="(\d+)"/);if(m){cx=+m[1];cy=+m[2]}}catch(e){}
  out.innerHTML='';note('Tampilan slide disederhanakan: font, animasi, dan beberapa efek tidak ditampilkan.');
  const W=Math.max(240,Math.min(out.clientWidth-16,900)),sc=W/(cx/12700);

  }
}
function pptText(buf){
  const b=new Uint8Array(buf),n=b.length;
  const u32=i=>(b[i]|(b[i+1]<<8)|(b[i+2]<<16)|(b[i+3]<<24))>>>0;
  const txt=i=>{
    if(!(b[i]===0&&b[i+1]===0&&b[i+3]===0x0F&&(b[i+2]===0xA0||b[i+2]===0xA8)))return null;
    const len=u32(i+4);if(!(len>0&&len<100000&&i+8+len<=n))return null;
    let t='';
    if(b[i+2]===0xA0){for(let k=0;k+1<len;k+=2)t+=String.fromCharCode(b[i+8+k]|(b[i+9+k]<<8))}
    else for(let k=0;k<len;k++)t+=String.fromCharCode(b[i+8+k]);
    return {t:t.replace(/[\r\x0b]/g,'\n').trim(),len};
  };
  const real=t=>/[A-Za-z0-9]/.test(t)&&!/^(Click to edit Master|Second level|Third level|Fourth level|Fifth level)/.test(t);
  const walk=(s,e)=>{
    const sl=[];let cur=null;
    for(let i=s;i<e-8;i++){
      if(b[i]===0&&b[i+1]===0&&b[i+2]===0xF3&&b[i+3]===0x03){cur=[];sl.push(cur);continue}
      const a=txt(i);
      if(a){if(real(a.t)){if(!cur){cur=[];sl.push(cur)}cur.push(a.t)}i+=7+a.len}
    }
    return sl;
  };
  let slides=[],notes=[];
  for(let i=0;i<n-8;i++){
    if(b[i+1]===0&&b[i+2]===0xF0&&b[i+3]===0x0F&&(b[i]&15)===15){
      const len=u32(i+4),inst=b[i]>>4;
      if(len>0&&i+8+len<=n){
        if(inst===0)slides=slides.concat(walk(i+8,i+8+len));
        else if(inst===2)notes=notes.concat(walk(i+8,i+8+len));
        i+=7+len;
      }
    }
  }
  let r='';
  slides.forEach((s,k)=>{if(s.length)r+='— Slide '+(k+1)+' —\n'+s.join('\n')+'\n\n'});
  const nt=[].concat(...notes).filter(Boolean);
  if(nt.length)r+='— Catatan —\n'+nt.join('\n\n');
  if(r.trim())return r.trim();
  const all=[];
  for(let i=0;i<n-8;i++){const a=txt(i);if(a){if(real(a.t))all.push(a.t);i+=7+a.len}}
  return all.join('\n\n');
}
function scrapeText(buf){
  const b=new Uint8Array(buf),n=b.length;
  const ok=c=>c===9||c===10||c===13||(c>=32&&c<=126)||(c>=160&&c<=591)||(c>=1024&&c<=1279);
  let U='',run='',i=0;
  while(i+1<n&&U.length<1e6){const c=b[i]|(b[i+1]<<8);if(ok(c)){run+=String.fromCharCode(c);i+=2}else{if(run.length>=8)U+=run+'\n';run='';i++}}
  if(run.length>=8)U+=run;
  let A='';run='';
  for(let k=0;k<n&&A.length<1e6;k++){const c=b[k];if(c===9||c===10||c===13||(c>=32&&c<=126))run+=String.fromCharCode(c);else{if(run.length>=8)A+=run+'\n';run=''}}
  if(run.length>=8)A+=run;
  return U.length>=A.length?U:A;
}
function scrapeImages(buf){
  const b=new Uint8Array(buf),n=b.length,res=[];let i=0,tot=0;
  const at=(p,v)=>p<n&&b[p]===v;
  while(i<n-12&&res.length<60&&tot<4e7){
    let end=-1,mime='';
    if(at(i,0x89)&&at(i+1,0x50)&&at(i+2,0x4E)&&at(i+3,0x47)&&at(i+4,0x0D)&&at(i+5,0x0A)&&at(i+6,0x1A)&&at(i+7,0x0A)){
      for(let j=i+8;j<n-8;j++)if(at(j,0x49)&&at(j+1,0x45)&&at(j+2,0x4E)&&at(j+3,0x44)){end=Math.min(n,j+8);break}
      mime='image/png';
    }else if(at(i,0xFF)&&at(i+1,0xD8)&&at(i+2,0xFF)){
      for(let j=i+3;j<n-1;j++)if(at(j,0xFF)&&at(j+1,0xD9)){const nb=j+3<n?b[j+3]:0;if(!(at(j+2,0xFF)&&nb>=0xC0&&nb<=0xFE)){end=j+2;break}}
      mime='image/jpeg';
    }
    if(end>0&&end-i>=3000){res.push(new Blob([b.subarray(i,end)],{type:mime}));tot+=end-i;i=end}else i++;
  }
  return res;
}
async function viewOld(buf,ext){
  out.innerHTML='';note('Format lama (.'+ext+'): teks dan gambar ditampilkan terpisah, tata letak asli tidak tersedia.');
  let t=(ext==='ppt'||ext==='pps'||ext==='pot')?pptText(buf):'';
  if(!t.trim())t=scrapeText(buf);
  const p=document.createElement('pre');p.className='txt';p.textContent=(t.trim()||'(Tidak ada teks yang bisa dibaca.)').slice(0,1500000);out.appendChild(p);
  const imgs=scrapeImages(buf);

    const bx=document.createElement('div');bx.className='slide';
    const h=document.createElement('h4');h.textContent='Gambar ('+imgs.length+')';bx.appendChild(h);
    for(const g of imgs)addImg(bx,await dataURL(g));
    out.appendChild(bx);
  }
}

const SHEET=new Set(['xlsx','xlsm','xlsb','xls','xlt','xltx','csv','tsv','ods','fods','numbers']);
async function openFile(file){
  document.getElementById('ttl').textContent=file.name;
  const ext=file.name.split('.').pop().toLowerCase();msg('Membuka…');
  try{
    if(IMG[ext]||file.type.startsWith('image/')){out.innerHTML='';addImg(out,await dataURL(file));return}
    const buf=await file.arrayBuffer();
    if(ext==='pdf')await viewPdf(buf);
    else if(['docx','docm','dotx','dotm'].includes(ext))await viewDocx(buf);
    else if(SHEET.has(ext))await viewSheet(buf,ext);
    else if(['pptx','pptm','ppsx','potx'].includes(ext))await viewPptx(buf);
    else if(['odt','ott','odp','otp'].includes(ext))await viewOdf(buf);
    else if(ext==='rtf')viewRtf(buf);
    else if(['html','htm','xhtml'].includes(ext))viewHtml(buf);
    else if(['doc','dot','ppt','pps','pot'].includes(ext))await viewOld(buf,ext);
    else viewPlain(buf,ext);
  }catch(e){msg('Gagal membuka file:\n'+e.message)}
}
